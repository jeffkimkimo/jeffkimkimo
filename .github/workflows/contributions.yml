name: Refresh contribution graph

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contribution_graph.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/contribution_graph.py
      - name: Save updated graph
        run: |
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution graph'
          git push origin HEAD:main
